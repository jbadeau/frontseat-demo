asyncapi: 3.0.0
info:
  title: CoinHub Transaction Events
  version: 1.0.0
  description: Event-driven API for CoinHub transaction events
  contact:
    name: Platform Team
servers:
  production:
    host: kafka.coinhub.internal:9092
    protocol: kafka
    description: Production Kafka cluster
channels:
  transactionCompleted:
    address: coinhub.transactions.completed
    messages:
      TransactionCompleted:
        $ref: '#/components/messages/TransactionCompleted'
    description: Published when a transaction completes successfully
  transactionFailed:
    address: coinhub.transactions.failed
    messages:
      TransactionFailed:
        $ref: '#/components/messages/TransactionFailed'
    description: Published when a transaction fails
  transferCompleted:
    address: coinhub.transfers.completed
    messages:
      TransferCompleted:
        $ref: '#/components/messages/TransferCompleted'
    description: Published when a fund transfer completes
operations:
  onTransactionCompleted:
    action: receive
    channel:
      $ref: '#/channels/transactionCompleted'
    summary: Subscribe to transaction completion events
  onTransactionFailed:
    action: receive
    channel:
      $ref: '#/channels/transactionFailed'
    summary: Subscribe to transaction failure events
  onTransferCompleted:
    action: receive
    channel:
      $ref: '#/channels/transferCompleted'
    summary: Subscribe to transfer completion events
components:
  messages:
    TransactionCompleted:
      name: TransactionCompleted
      title: Transaction Completed Event
      summary: Fired when a transaction completes successfully
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TransactionCompletedPayload'
    TransactionFailed:
      name: TransactionFailed
      title: Transaction Failed Event
      summary: Fired when a transaction fails
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TransactionFailedPayload'
    TransferCompleted:
      name: TransferCompleted
      title: Transfer Completed Event
      summary: Fired when a fund transfer completes
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TransferCompletedPayload'
  schemas:
    TransactionCompletedPayload:
      type: object
      required:
        - transactionId
        - accountId
        - amount
        - type
        - timestamp
      properties:
        transactionId:
          type: string
          description: Unique transaction identifier
        accountId:
          type: string
          description: Account involved in transaction
        amount:
          type: number
          format: double
        type:
          type: string
          enum: [deposit, withdrawal, transfer]
        description:
          type: string
        balanceAfter:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
    TransactionFailedPayload:
      type: object
      required:
        - transactionId
        - accountId
        - amount
        - reason
        - timestamp
      properties:
        transactionId:
          type: string
        accountId:
          type: string
        amount:
          type: number
          format: double
        reason:
          type: string
          enum: [insufficient_funds, invalid_account, limit_exceeded, fraud_detection]
        timestamp:
          type: string
          format: date-time
    TransferCompletedPayload:
      type: object
      required:
        - transferId
        - fromAccountId
        - toAccountId
        - amount
        - timestamp
      properties:
        transferId:
          type: string
        fromAccountId:
          type: string
        toAccountId:
          type: string
        amount:
          type: number
          format: double
        description:
          type: string
        timestamp:
          type: string
          format: date-time

# ============================================
# MANAGED BY FRONTSEAT - DO NOT EDIT MANUALLY
# Regenerate with: frontseat sync
# ============================================

name: CI

on:
  pull_request:
    branches: [main, release/**]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: setup
        run: |
          curl https://mise.run | sh
          ~/.local/bin/mise plugin add frontseat https://github.com/frontseat-dev/frontseat-mise 2>/dev/null || true
          ~/.local/bin/mise install
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: registry-login
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "$GH_TOKEN" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: build
        run: frontseat build --exec-mode local --cache-mode offline
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: ship
        if: github.event_name == 'pull_request' || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.event.inputs.release == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          frontseat ship
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

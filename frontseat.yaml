apiVersion: frontseat.io/v1alpha1
kind: Workspace
metadata:
  name: frontseat-demo
spec:
  version: latest
  platform:
    targets:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
  branching:
    strategy: release-flow
  ship:
    strategy: conventional-commits
    versioning: fixed
    changelog:
      enabled: true
    release:
      github:
        enabled: true
      tagPattern: "v{version}"
  plugins:
    frontseat/backstage: {}
    frontseat/github: {}
    frontseat/maven: {}
    frontseat/release-conventional-commits: {}
    frontseat/release-flow: {}

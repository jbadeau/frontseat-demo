apiVersion: frontseat.io/v1alpha1
kind: Workspace
metadata:
  name: frontseat-demo
spec:
  assistant:
    address: http://localhost:11434
    provider: ollama
  assistants:
    default: ollama
    providers:
      ollama:
        address: http://localhost:11434
  branching:
    strategy: release-flow
  platform:
    targets:
      - linux/amd64
      - darwin/arm64
      - windows/amd64
  plugins:
    frontseat/backstage: {}
    frontseat/docker: {}
    frontseat/dotnet: {}
    frontseat/github: {}
    frontseat/go: {}
    frontseat/maven: {}
    frontseat/mise: {}
    frontseat/node: {}
    frontseat/release-conventional-commits: {}
    frontseat/release-flow: {}
  reapi:
    address: localhost:50051
    logStreamAddress: localhost:50052
    provider: buildgrid
  ship:
    branching:
      strategy: release-flow
    versioning:
      strategy: conventional-commits
  targets:
    - linux/arm64
    - darwin/amd64
  tools:
    provider: mise

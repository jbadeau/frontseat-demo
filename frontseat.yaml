apiVersion: frontseat.io/v1alpha1
kind: Workspace
metadata:
  name: frontseat-demo
spec:
  ai:
    options:
      host: http://localhost:11434
    provider: ollama
  assistant:
    address: http://localhost:11434
    provider: ollama
  branching:
    strategy: release-flow
  platform:
    targets:
      - linux/amd64
      - darwin/amd64
  plugins:
    frontseat/backstage: {}
    frontseat/docker: {}
    frontseat/dotnet: {}
    frontseat/github: {}
    frontseat/go: {}
    frontseat/maven: {}
    frontseat/mise: {}
    frontseat/node: {}
    frontseat/release-conventional-commits: {}
    frontseat/release-flow: {}
  reapi:
    address: localhost:50051
    logStreamAddress: localhost:50052
    provider: buildgrid
  ship:
    strategy: conventional-commits
  targets:
    - linux/amd64
    - darwin/arm64
    - windows/amd64
  tools:
    manager:
      type: mise

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: recommendationservice
  description: Recommends products based on cart contents
  annotations:
    frontseat.dev/plugins: "uv, docker"
  labels:
    frontseat.dev/language: python
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: boutique
  providesApis:
    - api:default/boutique-proto
  dependsOn:
    - component:default/productcatalogservice
  dependencyOf:
    - component:default/frontend
  projects:
    - recommendationservice

openapi: 3.0.0
info:
  title: Partners API
  description: Partner management API for Gotham Financial Network
  version: 1.0.0
paths:
  /partners:
    get:
      summary: List partners
      operationId: listPartners
      responses:
        '200':
          description: A list of partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Partner'
    post:
      summary: Register partner
      operationId: registerPartner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerRegistration'
      responses:
        '201':
          description: Partner registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
  /partners/{partnerId}:
    get:
      summary: Get partner
      operationId: getPartner
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Partner details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '404':
          description: Partner not found
components:
  schemas:
    Partner:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
          enum:
            - standard
            - silver
            - gold
            - platinum
        status:
          type: string
          enum:
            - active
            - inactive
      required:
        - id
        - name
        - tier
        - status
    PartnerRegistration:
      type: object
      properties:
        name:
          type: string
        tier:
          type: string
          enum:
            - standard
            - silver
            - gold
            - platinum
      required:
        - name
        - tier

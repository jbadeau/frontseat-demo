[plugins]
frontseat = "https://github.com/frontseat-dev/frontseat-mise.git"

[tools]
# Managed by frontseat - frontseat CLI self-install
"frontseat:frontseat" = { version = "latest", plugins = "asyncapi,backstage,deno,docker,dotnet,gib,github,go,helm,maven,mise,npm,openapi,protobuf,release-conventional-commits,release-flow,rust,vite" }

[settings]
experimental= true

[tasks.nuke]
description = "Remove all generated files and directories"
run = "rm -rf .m2/ .frontseat/ ship/ target/ catalog-info.yaml frontseat.yaml"
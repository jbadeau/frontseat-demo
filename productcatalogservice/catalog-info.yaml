apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: productcatalogservice
  description: Provides product listing and search
  annotations:
    frontseat.dev/plugins: "go, docker"
  labels:
    frontseat.dev/language: go
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: boutique
  providesApis:
    - api:default/boutique-proto
  dependsOn:
    - api:default/boutique-proto
    - api:default/protos
  dependencyOf:
    - component:default/checkoutservice
    - component:default/frontend
    - component:default/recommendationservice
    - component:default/shoppingassistantservice

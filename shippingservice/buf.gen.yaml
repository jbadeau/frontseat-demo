version: v2

inputs:
  - directory: ../protos

plugins:
  - local: protoc-gen-go
    out: genproto
    opt:
      - module=github.com/GoogleCloudPlatform/microservices-demo/hipstershop
  - local: protoc-gen-go-grpc
    out: genproto
    opt:
      - module=github.com/GoogleCloudPlatform/microservices-demo/hipstershop

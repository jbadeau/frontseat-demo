openapi: 3.0.0
info:
  title: Accounts API
  description: Gotham Financial Accounts API — open accounts, query balances, and list transactions
  version: 1.0.0
paths:
  /accounts:
    post:
      summary: Open a new account
      operationId: openAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - accountType
              properties:
                name:
                  type: string
                  description: Account holder name
                accountType:
                  type: string
                  enum:
                    - checking
                    - savings
                    - business
                  description: Type of account to open
      responses:
        "201":
          description: Account opened successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /accounts/{accountId}/balance:
    get:
      summary: Get account balance
      operationId: getBalance
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: The account identifier (e.g. GF-A1B2C3D4)
      responses:
        "200":
          description: Account balance retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "404":
          description: Account not found
  /accounts/{accountId}/transactions:
    get:
      summary: List account transactions
      operationId: listTransactions
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: The account identifier
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Maximum number of transactions to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Number of transactions to skip
      responses:
        "200":
          description: Transaction list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  total:
                    type: integer
        "404":
          description: Account not found
components:
  schemas:
    Account:
      type: object
      properties:
        accountId:
          type: string
          description: Unique account identifier (e.g. GF-A1B2C3D4)
        name:
          type: string
          description: Account holder name
        accountType:
          type: string
          enum:
            - checking
            - savings
            - business
        openedAt:
          type: string
          format: date-time
    Balance:
      type: object
      properties:
        accountId:
          type: string
        available:
          type: number
          format: double
        pending:
          type: number
          format: double
        currency:
          type: string
          default: USD
    Transaction:
      type: object
      properties:
        transactionId:
          type: string
        accountId:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - credit
            - debit

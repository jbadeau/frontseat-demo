apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: transaction-api
  description: Transaction processing API
  annotations:
    frontseat.io/type: "openapi"
  tags:
    - transactions
    - banking
    - api
    - coinhub
spec:
  type: openapi
  lifecycle: production
  owner: platform
  system: coinhub
  definition: |
    openapi: 3.0.0
    info:
      title: CoinHub Transaction API
      version: 1.0.0
    paths:
      /transactions:
        get:
          summary: List transactions
        post:
          summary: Create new transaction
      /transactions/{id}:
        get:
          summary: Get transaction details
      /transfer:
        post:
          summary: Transfer funds between accounts

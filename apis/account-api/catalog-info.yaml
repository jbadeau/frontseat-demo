apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: account-api
  description: Account management API
  tags:
    - accounts
    - banking
    - api
    - coinhub
spec:
  type: openapi
  lifecycle: production
  owner: platform
  system: coinhub
  definition: |
    openapi: 3.0.0
    info:
      title: CoinHub Account API
      version: 1.0.0
    paths:
      /accounts:
        get:
          summary: List user accounts
        post:
          summary: Create new account
      /accounts/{id}:
        get:
          summary: Get account details
        put:
          summary: Update account
      /accounts/{id}/balance:
        get:
          summary: Get account balance

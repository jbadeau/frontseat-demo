apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: auth-api
  description: Authentication and authorization API
  tags:
    - auth
    - jwt
    - api
    - coinhub
spec:
  type: openapi
  lifecycle: production
  owner: platform
  system: coinhub
  definition: |
    openapi: 3.0.0
    info:
      title: CoinHub Auth API
      version: 1.0.0
    paths:
      /login:
        post:
          summary: Authenticate user and get JWT token
      /validate:
        post:
          summary: Validate JWT token

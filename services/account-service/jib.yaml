apiVersion: jib/v1alpha1
kind: BuildFile

from:
  image: gcr.io/distroless/java17-debian12

entrypoint:
  - java
  - -jar
  - /app/account-service.jar

labels:
  org.opencontainers.image.title: account-service
  org.opencontainers.image.description: CoinHub Account Service

layers:
  entries:
    - name: app
      files:
        - src: target/account-service-1.0.0.jar
          dest: /app/account-service.jar

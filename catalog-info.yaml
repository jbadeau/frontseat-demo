apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: demo
  description: Demo team
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: frontseat-demo
  description: Frontseat demo workspace
  annotations:
    frontseat.dev/container-registry: ghcr.io/jbadeau
spec:
  owner: demo
  platform:
    targets:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
  branching:
    strategy: release-flow
  ship:
    strategy: conventional-commits
    versioning: fixed
    tagPattern: "v{version}"

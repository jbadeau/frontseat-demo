apiVersion: frontseat.io/v1
kind: Workspace
metadata:
  name: coinhub
spec:
  runner:
    type: reapi
    options:
      address: "localhost:50051"
      instanceName: ""
      logstreamAddress: "localhost:50052"
  plugins:
    backstage: {}
    maven: {}
    go: {}
    rust: {}
    openapi: {}
    asyncapi: {}
    jib: {}
    helm: {}
    otel:
      options:
        endpoint: "localhost:4317"
        insecure: "true"
    dotnet: {}
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: coinhub-parent
  description: CoinHub Maven Parent POM - Multi-module project aggregator
  annotations:
    frontseat.io/type: "maven"
  tags:
    - java
    - maven
    - parent-pom
    - coinhub
spec:
  type: library
  lifecycle: production
  owner: platform
  system: coinhub
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: frontseat-demo
  description: Root catalog location for the frontseat-demo repository
spec:
  targets:
    - ./apis/account-api/catalog-info.yaml
    - ./apis/auth-api/catalog-info.yaml
    - ./apis/transaction-api/catalog-info.yaml
    - ./events/account-events/catalog-info.yaml
    - ./events/transaction-events/catalog-info.yaml
    - ./libs/common-lib/catalog-info.yaml
    - ./libs/deno-lib/catalog-info.yaml
    - ./libs/go-lib/catalog-info.yaml
    - ./libs/rust-lib/catalog-info.yaml
    - ./services/account-service/catalog-info.yaml
    - ./services/auth-service/catalog-info.yaml
    - ./services/notification-service/catalog-info.yaml
    - ./services/transaction-service/catalog-info.yaml
    - ./web/coinhub-ui/catalog-info.yaml

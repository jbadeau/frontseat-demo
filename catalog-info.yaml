apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: online-boutique
  description: Online Boutique - a cloud-first microservices demo application
  annotations:
    frontseat.dev/container-registry: ghcr.io/online-boutique
spec:
  owner: platform-team
  platform:
    targets:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
  branching:
    strategy: release-flow
  ship:
    strategy: conventional-commits
    versioning: fixed
    tagPattern: "v{version}"
  projects:
    - online-boutique
    - productcatalogservice
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: boutique
  description: Online Boutique e-commerce platform
spec:
  owner: platform-team
  domain: online-boutique

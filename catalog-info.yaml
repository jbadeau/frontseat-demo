# --- Domains ---

apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: retail-banking
  description: Retail Banking — Customer-facing banking products and services
  annotations:
    frontseat.dev/container-registry: ghcr.io/gotham-financial
spec:
  owner: wayne-enterprises
  platform:
    targets:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
  branching:
    strategy: release-flow
  ship:
    strategy: conventional-commits
    versioning: fixed
    tagPattern: "v{version}"

---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: capital-markets
  description: Capital Markets — Trading, partnerships & operations
  annotations:
    frontseat.dev/container-registry: ghcr.io/gotham-financial
spec:
  owner: wayne-enterprises
  platform:
    targets:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
  branching:
    strategy: release-flow
  ship:
    strategy: conventional-commits
    versioning: fixed
    tagPattern: "v{version}"

